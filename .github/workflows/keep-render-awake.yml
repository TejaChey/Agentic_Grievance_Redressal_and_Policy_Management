# Render's free plan puts the backend to sleep after 15 idle minutes, which pauses the
# SLA escalation checks and makes the next visitor wait about a minute. Pinging /health
# every 10 minutes keeps it awake (one always-on service fits in the free 750 hours/month).
#
# Setup: GitHub repo → Settings → Secrets and variables → Actions → Variables →
# add RENDER_BACKEND_URL = https://<your-service>.onrender.com (no trailing slash).
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        env:
          BACKEND_URL: ${{ vars.RENDER_BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::notice::RENDER_BACKEND_URL is not set; skipping."
            exit 0
          fi
          # A sleeping service can take ~60s to wake, so allow a long timeout and a few retries
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 10 \
            "${BACKEND_URL%/}/health"
